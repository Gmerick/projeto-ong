<section class="section"><div class="container"><span class="eyebrow">Participe</span><h1>Cadastro de apoiadores e voluntários</h1><p class="lead">Preencha os dados para demonstrar interesse nas ações da organização.</p><form id="support-form" novalidate><fieldset><legend>Dados pessoais</legend><div class="form-grid"><div class="field"><label for="nome">Nome completo</label><input id="nome" name="nome" required minlength="3" autocomplete="name"><small class="field-error" data-error-for="nome"></small></div><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" required autocomplete="email"><small class="field-error" data-error-for="email"></small></div><div class="field"><label for="cpf">CPF</label><input id="cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" required><small class="field-error" data-error-for="cpf"></small></div><div class="field"><label for="telefone">Telefone</label><input id="telefone" name="telefone" type="tel" placeholder="(00) 00000-0000" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" required><small class="field-error" data-error-for="telefone"></small></div><div class="field"><label for="cep">CEP</label><input id="cep" name="cep" inputmode="numeric" placeholder="00000-000" pattern="[0-9]{5}-[0-9]{3}" required><small class="field-error" data-error-for="cep"></small></div><div class="field"><label for="disponibilidade">Disponibilidade</label><select id="disponibilidade" name="disponibilidade" required><option value="">Selecione</option><option>Manhã</option><option>Tarde</option><option>Noite</option><option>Finais de semana</option></select><small class="field-error" data-error-for="disponibilidade"></small></div></div></fieldset><fieldset><legend>Participação</legend><div class="field"><label for="participacao">Como deseja contribuir?</label><select id="participacao" name="participacao" required><option value="">Selecione</option><option value="voluntariado">Voluntariado</option><option value="doacao">Doação</option><option value="ambos">Ambos</option></select><small class="field-error" data-error-for="participacao"></small></div><div class="field"><label for="interesses">Área de interesse</label><select id="interesses" name="interesses" required><option value="">Selecione</option><option value="educacao">Educação</option><option value="tecnologia">Tecnologia</option><option value="comunidade">Comunidade</option></select><small class="field-error" data-error-for="interesses"></small></div></fieldset><label><input type="checkbox" id="consentimento" required> Autorizo o uso destes dados para contacto relacionado às atividades da ONG.</label><div class="actions"><button class="button button-primary" type="submit">Enviar cadastro</button><button class="button button-secondary" type="reset">Limpar</button></div></form></div></section>
